[package]
name = "fpt-metal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Metal SDF path tracer compatible with FPT Beauty scenes"
repository = "https://github.com/totttty/fractalpathtracer"
build = "build.rs"
include = ["/Cargo.toml", "/Cargo.lock", "/build.rs", "/rust-toolchain.toml", "src/**", "shaders/**", "scenes/**", "tests/**", "examples/**", "/README.md", "/LICENSE", "/NOTICE", "docs/fractal-library-api.md", "docs/release-preparation.md", "docs/mandel-release-results.json", "docs/mandel-ranked50-review.json", "docs/mandel-outlier-diagnosis.json", "scripts/run_release_canaries.py", "scripts/run_mandel_tile_gate.py", "scripts/run_mandel_support_suite.py", "scripts/run_mandel_geometry_controls.py", "scripts/test_release_canaries.py", "scripts/test_mandel_support_suite.py", "scripts/test_mandel_geometry_controls.py", "scripts/requirements-release.txt", "scripts/run_metal_precision_gate.py", "scripts/test_metal_precision_gate.py"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["hdr", "jpeg", "png"] }
marching-cubes = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
cc = "1.2"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
