[package]
name = "fpt-metal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Metal SDF path tracer compatible with FPT Beauty scenes"
build = "build.rs"

[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
